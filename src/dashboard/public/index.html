<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Squadron Dashboard</title>
    <style>
      :root {
        --bg: #f2f5f8;
        --card: #ffffff;
        --text: #152538;
        --muted: #5a6b7f;
        --accent: #0d9488;
        --accent-soft: #d8f4f1;
        --warning: #c2410c;
        --ok: #166534;
        --border: #d6dde6;
      }

      body {
        margin: 0;
        font-family: "Segoe UI", Tahoma, sans-serif;
        background: radial-gradient(circle at top, #e9f3ff 0%, var(--bg) 60%);
        color: var(--text);
      }

      .container {
        max-width: 1100px;
        margin: 0 auto;
        padding: 24px 16px 40px;
      }

      h1 {
        margin: 0 0 8px;
      }

      p {
        margin: 0;
        color: var(--muted);
      }

      .metrics {
        margin-top: 20px;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
        gap: 12px;
      }

      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 14px;
        box-shadow: 0 3px 10px rgba(0, 0, 0, 0.04);
      }

      .metric-label {
        color: var(--muted);
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }

      .metric-value {
        margin-top: 6px;
        font-size: 22px;
        font-weight: 700;
      }

      .workflows {
        margin-top: 18px;
        display: grid;
        gap: 12px;
      }

      .workflow-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
      }

      .badge {
        border-radius: 999px;
        font-size: 12px;
        padding: 4px 10px;
        font-weight: 700;
      }

      .badge.in-progress {
        background: var(--accent-soft);
        color: var(--accent);
      }

      .badge.completed {
        background: #e8f8ec;
        color: var(--ok);
      }

      .badge.failed {
        background: #fde7df;
        color: var(--warning);
      }

      .badge.pending {
        background: #e8edf3;
        color: #41556d;
      }

      .muted {
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main class="container">
      <h1>Squadron</h1>
      <p>Workflow progress and token usage (auto-refresh every 5 seconds).</p>
      <section class="metrics" id="metrics"></section>
      <section class="workflows" id="workflows"></section>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
